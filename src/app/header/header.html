<header class="header-tlo">
    <div class="wrapper">

        <!-- routerlink "" przenosi na home, glowny widok -->
        <a class="logo" routerLink="/">
            <img class="logo-img" src="swiat-kawy.png">
            <h1>ŚWIAT KAWY</h1>
        </a>



        <div class="wyszukiwarka-x">
            <input #szukajka inputmode="search" type="text" placeholder="Szukaj" class="wyszukiwarka-pole" [class.szukamy]="szukajAktywne" (keyup.enter)="toggleWyszukiwarka(szukajka)" (input)="zawartoscInputa(szukajka)" (focus)="szukajAktywne = true">
            <span class="lupa-komp">
                <i class="ph ph-magnifying-glass"></i></span>
            <!-- szukajAktywne = true powinno przymusić szukajke pojawic sie po wyczyszczeniu na telefonie
                 $event.preventDefault() blokuje domyślną reakcję przeglądarki czyli utrate fokusu i zwiniecie klawiatury-->
            <button class="przycisk-kasuj" [class.widoczny]="szukajka.value.length > 0" (mousedown)="$event.preventDefault()" (click)="
                      szukajAktywne = false;
                      szukajka.value = '';
                      wyszukiwarka.szukanaFraza.set('');
                      szukajka.blur()
                    ">
                <i class="ph ph-x"></i></button>
        </div>




        <ul class="nawigacja" [class.szukamy-nawigacja]="szukajAktywne" [class.podstrona]="router.url !== '/'">
            <li>
                @if (router.url === '/') {
                <button class="przycisk-szukaj-mobile" (click)="toggleWyszukiwarka(szukajka)">
                    <i class="ph ph-magnifying-glass"></i></button>
                } @else {<a routerLink="/" class="przycisk-szukaj-mobile logo-ziarno"><i class="ph ph-coffee-bean"></i></a>}

            </li>

            <li>
                <a class="ulubione">
                    <i class="ph ph-heart"></i>
                    <span class="naw-tekst">Ulubione</span>
                </a>
            </li>

            <li>
                <a class="kontakt" routerLink="/o-nas">
                    <i class="ph ph-coffee"></i>
                    <span class="naw-tekst">O nas / Kontakt</span>
                </a>
            </li>

            <li>
                <a class="koszyk">
                    <i class="ph ph-basket"></i>
                    <span class="naw-tekst">Koszyk</span>
                </a>
            </li>


            <li>
                <a class="zaloguj">
                    <i class="ph ph-user-circle"></i>
                    <span class="naw-tekst">Zaloguj się</span>
                </a>
            </li>

            <!-- !-- <li>
                <a class="nawigacja-konto">
                    <i class="ph ph-smiley"></i>
                    Konto
                </a>
            </li> -- -->

        </ul>


    </div>
</header>
