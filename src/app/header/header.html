<header class="header-tlo">
    <div class="wrapper">
        <a class="logo">
            <img class="logo-img" src="swiat-kawy.png">
            <h1>ŚWIAT KAWY</h1>
        </a>


        <div class="wyszukiwarka-x">
            <input #szukajka inputmode="search" type="text" placeholder="Szukaj" class="wyszukiwarka-pole"
                [class.szukamy]="szukajAktywne" (keyup.enter)="toggleWyszukiwarka(szukajka)"
                (input)="onInput(szukajka)">
            <!-- (input)="szukajkaAkcja.emit(szukajka.value) dzieki (input) przy każdej literce Header „krzyknie” do App: „Zmieniło się! Szukaj od nowa!”, a funkcja filtruj natychmiast odświeży widok. -->

            <span class="lupa-komp">
                <i class="ph ph-magnifying-glass"></i></span>

            <!-- szukajAktywne = true powinno przymusić szukajke pojawic sie po wyczyszczeniu na telefonie -->
            <button class="przycisk-kasuj" [class.widoczny]="szukajka.value.length > 0"
                (mousedown)="$event.preventDefault()" (click)="
                  szukajAktywne = true;
                  szukajka.value = '';
                  szukajkaAkcja.emit('');
                  szukajka.focus()">
                <i class="ph ph-x"></i></button>
        </div>



        <ul class="nawigacja" [class.szukamy-nawigacja]="szukajAktywne">
            <li>
                <button class="przycisk-szukaj-mobile" (click)="toggleWyszukiwarka(szukajka)">
                    <i class="ph ph-magnifying-glass"></i></button>

            </li>

            <li>
                <a class="dostawa">
                    <i class="ph ph-truck"></i>
                    <span class="naw-tekst">Dostawa</span>
                </a>
            </li>

            <li>
                <a class="koszyk">
                    <i class="ph ph-basket"></i>
                    <span class="naw-tekst">Koszyk</span>
                </a>
            </li>

            <li>
                <a class="kontakt">
                    <i class="ph ph-coffee"></i>
                    <span class="naw-tekst">O nas / Kontakt</span>
                </a>
            </li>

            <li>
                <a class="zaloguj">
                    <i class="ph ph-user-circle"></i>
                    <span class="naw-tekst">Zaloguj się</span>
                </a>
            </li>

            <!-- !-- <li>
                <a class="nawigacja-konto">
                    <i class="ph ph-smiley"></i>
                    Konto
                </a>
            </li> -- -->

        </ul>


    </div>
</header>
